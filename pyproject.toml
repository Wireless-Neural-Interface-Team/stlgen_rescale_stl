[project]
name = "rescale-stl"
version = "0.0.1"
description = "Qt GUI + library to align and non-uniformly rescale Allen CCF brain STLs to a skull STL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "trimesh",
    "pyvista>=0.43",
    "pyvistaqt",
    "PySide6",
]

[project.scripts]
rescale-stl = "rescale_app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rescale_app"]
